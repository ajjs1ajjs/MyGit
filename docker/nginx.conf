server {
    listen 80;
    server_name git.company.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name git.company.local;

    ssl_certificate /etc/ssl/certs/mygit.crt;
    ssl_certificate_key /etc/ssl/private/mygit.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    # Generate self-signed cert for development:
    #   $ openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #       -keyout /etc/ssl/private/mygit.key \
    #       -out /etc/ssl/certs/mygit.crt -subj "/CN=localhost"

    client_max_body_size 500m;
    proxy_request_buffering off;

    location / {
        root /opt/mygit/frontend/dist;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(.+/.+)\.git/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 500m;
        proxy_request_buffering off;
    }

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }
}
