services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mygit}
      POSTGRES_USER: ${POSTGRES_USER:-mygit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ..:/app
      - repos:/repos
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://${POSTGRES_USER:-mygit}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-mygit}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - MYGIT_REPOS_ROOT=/repos
      - MYGIT_INTERNAL_API_TOKEN=${MYGIT_INTERNAL_API_TOKEN:-change-me}
    depends_on:
      - db
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/metrics/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ..:/app
      - repos:/repos
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://${POSTGRES_USER:-mygit}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-mygit}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me}
      - MYGIT_REPOS_ROOT=/repos
      - MYGIT_INTERNAL_API_TOKEN=${MYGIT_INTERNAL_API_TOKEN:-change-me}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache openssl >/dev/null 2>&1 &&
      mkdir -p /etc/ssl/certs /etc/ssl/private &&
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/ssl/private/mygit.key
        -out /etc/ssl/certs/mygit.crt
        -subj '/CN=localhost' >/dev/null 2>&1 &&
      exec nginx -g 'daemon off;'
      "
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  pgdata:
  repos:
  static_volume:
  media_volume:
