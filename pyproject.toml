[project]
name = "mygit"
version = "0.1.0"
description = "Self-hosted Git platform for enterprise"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
