---
# =============================================================================
# MyGit Production Deployment Playbook
# Target: Ubuntu 22.04+ / Debian 12+
# Ansible 2.14+ required
# =============================================================================
- name: Deploy MyGit
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    # --------------- Core ---------------
    mygit_user: mygit
    mygit_group: mygit
    mygit_home: /opt/mygit
    mygit_backend_dir: "{{ mygit_home }}/backend"
    mygit_venv_dir: "{{ mygit_home }}/venv"
    mygit_repos_root: "{{ mygit_home }}/repos"
    mygit_static_root: "{{ mygit_home }}/static"
    mygit_media_root: "{{ mygit_home }}/media"
    mygit_log_dir: "{{ mygit_home }}/logs"

    # --------------- Networking ---------------
    domain: "{{ inventory_hostname }}"
    http_port: 8060
    gunicorn_port: 8000
    git_http_port: 8001

    # --------------- Database ---------------
    db_name: mygit
    db_user: mygit
    db_password: "{{ vault_postgres_password | default(ookup('password', '/dev/null length=48 chars=hex')) }}"

    # --------------- Django ---------------
    django_secret_key: "{{ vault_django_secret_key | default(ookup('password', '/dev/null length=64 chars=hex')) }}"
    django_settings_module: config.settings.production
    django_allowed_hosts: "{{ domain }},localhost,127.0.0.1"
    cors_origins: "http://{{ domain }}:{{ http_port }}"

    # --------------- Redis / Celery ---------------
    redis_url: redis://localhost:6379/1
    celery_broker_url: redis://localhost:6379/0
    celery_result_backend: redis://localhost:6379/0

    # --------------- Git ---------------
    git_binary: /usr/bin/git
    git_repo_url: "{{ git_repo_url | default('https://github.com/ajjs1ajjs/MyGit.git') }}"
    git_version: "{{ git_branch | default('main') }}"

    # --------------- Internal API token (SSH hooks / CI runner) ---------------
    mygit_internal_token: "{{ vault_internal_token | default(lookup('password', mygit_home + '/.ssh-token chars=base64 length=32')) }}"

    # --------------- Python ---------------
    python_version: "3.12"
    python_bin: "/usr/bin/python{{ python_version }}"

  environment:
    DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
    PATH: "{{ mygit_venv_dir }}/bin:{{ ansible_env.PATH }}"

  # ============================================================================
  # PRE-CHECKS
  # ============================================================================
  pre_tasks:
    - name: Fail on unsupported OS
      fail:
        msg: "This playbook requires Ubuntu 22.04+ or Debian 12+."
      when: >
        ansible_facts['os_family'] != 'Debian'
        or (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] is version('22.04', '<'))
        or (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_version'] is version('12', '<'))

    - name: Ensure required Ansible collections
      assert:
        that:
          - "'community.postgresql' in ansible_facts.packages or 'psycopg2-binary' is installed"
        fail_msg: "Install community.postgresql: ansible-galaxy collection install community.postgresql"
      ignore_errors: yes

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

  # ============================================================================
  # ROLES & TASKS
  # ============================================================================
  tasks:

    # --------------------------------------------------------------------------
    # 1. SYSTEM PACKAGES
    # --------------------------------------------------------------------------
    - name: 1/10 | Install system dependencies
      apt:
        name:
          - git
          - "python{{ python_version }}"
          - "python{{ python_version }}-venv"
          - python3-pip
          - python3-dev
          - libpq-dev
          - postgresql
          - postgresql-contrib
          - redis-server
          - nginx
          - rsync
          - curl
          - wget
          - ca-certificates
          - acl                          # for setting permissions
          - ufw                           # firewall
        state: present
        install_recommends: no

    - name: 1/10 | Ensure services are enabled and running
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - postgresql
        - redis-server

    # --------------------------------------------------------------------------
    # 2. SYSTEM USER & DIRECTORIES
    # --------------------------------------------------------------------------
    - name: 2/10 | Create mygit system user
      user:
        name: "{{ mygit_user }}"
        group: "{{ mygit_group }}"
        home: "{{ mygit_home }}"
        shell: /bin/bash
        system: yes
        create_home: yes

    - name: 2/10 | Create project directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ mygit_user }}"
        group: "{{ mygit_group }}"
        mode: "0755"
      loop:
        - "{{ mygit_repos_root }}"
        - "{{ mygit_log_dir }}"
        - "{{ mygit_static_root }}"
        - "{{ mygit_media_root }}"
        - "{{ mygit_home }}/backups"

    # --------------------------------------------------------------------------
    # 3. POSTGRESQL DATABASE
    # --------------------------------------------------------------------------
    - name: 3/10 | Ensure PostgreSQL is accepting connections
      lineinfile:
        path: /etc/postgresql/*/main/pg_hba.conf
        regexp: '^local\s+all\s+all'
        line: 'local   all   all   peer'
      notify: restart postgresql

    - name: 3/10 | Create PostgreSQL user
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        role_attr_flags: CREATEDB
      no_log: yes

    - name: 3/10 | Create PostgreSQL database
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        encoding: UTF8
        lc_collate: en_US.UTF-8
        lc_ctype: en_US.UTF-8

    # --------------------------------------------------------------------------
    # 4. CLONE APPLICATION
    # --------------------------------------------------------------------------
    - name: 4/10 | Clone or update application repository
      git:
        repo: "{{ git_repo_url }}"
        dest: "{{ mygit_backend_dir }}"
        version: "{{ git_version }}"
        force: yes
        accept_hostkey: yes
      notify: restart mygit services

    - name: 4/10 | Set ownership of backend directory
      file:
        path: "{{ mygit_backend_dir }}"
        state: directory
        owner: "{{ mygit_user }}"
        group: "{{ mygit_group }}"
        recurse: yes

    # --------------------------------------------------------------------------
    # 5. PYTHON VIRTUALENV & DEPENDENCIES
    # --------------------------------------------------------------------------
    - name: 5/10 | Create Python virtual environment
      command:
        cmd: "{{ python_bin }} -m venv {{ mygit_venv_dir }}"
        creates: "{{ mygit_venv_dir }}/bin/activate"

    - name: 5/10 | Upgrade pip
      pip:
        name: pip
        state: latest
        virtualenv: "{{ mygit_venv_dir }}"
        virtualenv_python: "{{ python_bin }}"

    - name: 5/10 | Install Python dependencies
      pip:
        requirements: "{{ mygit_backend_dir }}/requirements.txt"
        virtualenv: "{{ mygit_venv_dir }}"
        virtualenv_python: "{{ python_bin }}"
        state: present
      notify: restart mygit services

    - name: 5/10 | Install production-only extras (gunicorn, psycopg2)
      pip:
        name:
          - gunicorn
          - psycopg2-binary
          - uvicorn[standard]
        virtualenv: "{{ mygit_venv_dir }}"
        virtualenv_python: "{{ python_bin }}"
        state: present

    # --------------------------------------------------------------------------
    # 6. ENVIRONMENT CONFIGURATION
    # --------------------------------------------------------------------------
    - name: 6/10 | Deploy .env configuration
      template:
        src: .env.j2
        dest: "{{ mygit_home }}/.env"
        owner: "{{ mygit_user }}"
        group: "{{ mygit_group }}"
        mode: "0600"
      no_log: yes
      notify: restart mygit services

    - name: 6/10 | Protect SSH token file (readable by mygit group for git hooks)
      file:
        path: "{{ mygit_home }}/.ssh-token"
        owner: root
        group: "{{ mygit_group }}"
        mode: "0640"

    # --------------------------------------------------------------------------
    # 7. DATABASE MIGRATIONS & STATIC FILES
    # --------------------------------------------------------------------------
    - name: 7/10 | Run database migrations
      become_user: "{{ mygit_user }}"
      command:
        cmd: "{{ mygit_venv_dir }}/bin/python manage.py migrate --noinput"
        chdir: "{{ mygit_backend_dir }}"
      environment:
        DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
        MYGIT_HOME: "{{ mygit_home }}"

    - name: 7/10 | Collect static files
      become_user: "{{ mygit_user }}"
      command:
        cmd: "{{ mygit_venv_dir }}/bin/python manage.py collectstatic --noinput --clear -v0"
        chdir: "{{ mygit_backend_dir }}"
      environment:
        DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
        MYGIT_HOME: "{{ mygit_home }}"

    - name: 7/10 | Create admin superuser (idempotent)
      become_user: "{{ mygit_user }}"
      command:
        cmd: |
          {{ mygit_venv_dir }}/bin/python manage.py shell -c "
import os, django
os.environ['DJANGO_SETTINGS_MODULE'] = '{{ django_settings_module }}'
django.setup()
from django.contrib.auth import get_user_model
User = get_user_model()
if not User.objects.filter(is_superuser=True).exists():
    pw = os.environ.get('MYGIT_ADMIN_PASSWORD', '{{ vault_admin_password | default(\"admin123\") }}')
    User.objects.create_superuser('admin', 'admin@mygit.local', pw)
    print('Admin created')
else:
    print('Admin exists')
"
        chdir: "{{ mygit_backend_dir }}"
      environment:
        DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
      register: admin_result
      changed_when: "'Admin created' in admin_result.stdout"

    # --------------------------------------------------------------------------
    # 8. SYSTEMD SERVICES
    # --------------------------------------------------------------------------
    - name: 8/10 | Deploy systemd service files
      template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - mygit-api.service
        - mygit-git-http.service
        - mygit-celery.service
        - mygit-celery-beat.service
      notify: restart mygit services

    - name: 8/10 | Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: 8/10 | Enable and start systemd services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - mygit-api.service
        - mygit-git-http.service
        - mygit-celery.service
        - mygit-celery-beat.service

    # --------------------------------------------------------------------------
    # 9. NGINX REVERSE PROXY
    # --------------------------------------------------------------------------
    - name: 9/10 | Deploy Nginx configuration
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/mygit
        owner: root
        group: root
        mode: "0644"
      notify: restart nginx

    - name: 9/10 | Enable MyGit Nginx site
      file:
        src: /etc/nginx/sites-available/mygit
        dest: /etc/nginx/sites-enabled/mygit
        state: link
      notify: restart nginx

    - name: 9/10 | Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart nginx

    - name: 9/10 | Validate Nginx configuration
      command: nginx -t
      changed_when: no

    - name: 9/10 | Ensure Nginx is running
      systemd:
        name: nginx
        state: started
        enabled: yes

    # --------------------------------------------------------------------------
    # 10. FIREWALL & HARDENING
    # --------------------------------------------------------------------------
    - name: 10/10 | Configure UFW firewall
      ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port | default(omit) }}"
        proto: "{{ item.proto | default('tcp') }}"
        to_port: "{{ item.to_port | default(omit) }}"
      loop:
        - { rule: allow, port: '22', proto: tcp }
        - { rule: allow, port: '{{ http_port }}', proto: tcp }
        - { rule: allow, port: '443', proto: tcp }
      when: ansible_facts['os_family'] == 'Debian'

    - name: 10/10 | Enable UFW
      ufw:
        state: enabled
        policy: deny
        direction: incoming
      when: ansible_facts['os_family'] == 'Debian'

    - name: 10/10 | Set directory permissions
      file:
        path: "{{ mygit_repos_root }}"
        owner: "{{ mygit_user }}"
        group: "{{ mygit_group }}"
        mode: "0700"
        recurse: yes

    # --------------------------------------------------------------------------
    # HANDLERS
    # --------------------------------------------------------------------------
  handlers:
    - name: restart mygit services
      systemd:
        name: "{{ item }}"
        state: restarted
        daemon_reload: yes
      loop:
        - mygit-api.service
        - mygit-git-http.service
        - mygit-celery.service
        - mygit-celery-beat.service

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: restart postgresql
      systemd:
        name: postgresql
        state: restarted

  # ============================================================================
  # TEMPLATES (inline - stored as files in ansible/templates/ or embedded below)
  # ============================================================================
  # Templates expected alongside this playbook:
  #   - templates/.env.j2
  #   - templates/mygit-gunicorn.service.j2
  #   - templates/mygit-celery.service.j2
  #   - templates/mygit-celery-beat.service.j2
  #   - templates/nginx.conf.j2
  #
  # See companion file ansible/templates/ for their contents.
