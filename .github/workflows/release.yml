name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/mygit-linux-amd64 ./cmd/mygit
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/mygit-linux-arm64 ./cmd/mygit
          cd dist
          sha256sum * > checksums.txt

      - name: Create public release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          PUBLIC_REPO: ajjs1ajjs/MyGit
        run: |
          test -n "$GH_TOKEN"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$PUBLIC_REPO" --title "MyGit $GITHUB_REF_NAME" --generate-notes
